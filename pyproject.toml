[project]
name = "salon-booking"
version = "0.1.0"
description = "Запись клиентов в салон красоты: FastAPI + Telegram-бот"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "alembic>=1.20.0",
    "black>=26.10.1",
    "tzdata>=2024.2",
    "aiogram>=3.13",
    "pyjwt>=2.8",
    "bcrypt>=4.2",
    "structlog>=24.1",
    "sentry-sdk>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic генерирует файлы миграций, не следующие стилю проекта (Union[...] и т.п.),
# поэтому не линтуем их: правки там всё равно перезапишутся при следующей автогенерации.
exclude = ["app/migrations"]

[tool.ruff.lint]
# E, F — базовые ошибки; I — порядок импортов; UP — устаревший синтаксис; B — типичные баги
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# async def test_* автоматически оборачиваются pytest-asyncio (без явных @pytest.mark.asyncio).
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
# Ловим реальные ошибки: пропущенные аннотации, несоответствие типов на границах вызовов.
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Сторонние библиотеки без полных stubs не должны валить CI (aiogram, asyncpg, redis и т.п.).
ignore_missing_imports = true
# Миграции Alembic генерируются автоматически и не следуют строгой типизации проекта.
exclude = ["^app/migrations/"]

