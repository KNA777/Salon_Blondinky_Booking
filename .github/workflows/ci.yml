name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check app tests

      - name: Ruff format check
        run: uv run ruff format --check app tests

      - name: mypy
        run: uv run mypy app

  pytest-unit:
    name: Pytest (unit, без БД)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      # Юнит-тесты не требуют Postgres/Redis: интеграционные (tests/integration)
      # сами пропускаются через pytest.skip, когда БД недоступна. Секретный ключ
      # задаём фиксированно, чтобы тесты auth детерминированно проходили в CI.
      - name: Run unit tests
        env:
          JWT_SECRET_KEY: "ci-test-secret"
        run: uv run pytest tests --ignore=tests/integration -q

  pytest-integration:
    name: Pytest (integration, реальный Postgres)
    runs-on: ubuntu-latest
    # Интеграционные тесты гоняют exclusion-constraint и требуют настоящий Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      # conftest.py читает POSTGRES_* и сам создаёт тестовую БД salon_blondinky_test.
      - name: Run integration tests
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          JWT_SECRET_KEY: "ci-test-secret"
        run: uv run pytest tests/integration -q
